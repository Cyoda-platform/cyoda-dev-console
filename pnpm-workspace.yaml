packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
# Catalog mirrors cyoda-workflow-editor's catalog so the workspace-member
# library packages (included above) can resolve their `catalog:` specifiers,
# and so this app stays in lockstep on shared deps. Keep in sync with
# ../cyoda-workflow-editor/pnpm-workspace.yaml.
catalog:
  "@changesets/cli": 2.31.0
  "@playwright/test": 1.60.0
  "@testing-library/dom": 10.4.1
  "@testing-library/react": 16.3.2
  "@types/node": 25.9.2
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
  "@eslint/js": 10.0.1
  "@typescript-eslint/eslint-plugin": 8.61.0
  "@typescript-eslint/parser": 8.61.0
  "@vitejs/plugin-react": 6.0.2
  "@vitest/coverage-v8": 4.1.8
  eslint: 10.4.1
  fast-check: 4.8.0
  elkjs: 0.11.1
  immer: 11.1.8
  jsdom: 29.1.1
  jsonc-parser: 3.3.1
  monaco-editor: 0.55.1
  prettier: 3.8.4
  typescript-eslint: 8.61.0
  react: 19.2.7
  react-dom: 19.2.7
  reactflow: 11.11.4
  tsup: 8.5.1
  typescript: 6.0.3
  uuid: 14.0.0
  vite: 8.0.16
  vitest: 4.1.8
  zod: 4.4.3
