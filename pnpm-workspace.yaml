packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
# Shared dependency catalog for this repo's own workspace members — the internal
# `packages/*` and both apps resolve their `catalog:` specifiers from here.
#
# It tracks ../cyoda-workflow-editor/pnpm-workspace.yaml but is NOT a mirror and
# need not match entry-for-entry. The @cyoda/workflow-* packages come from public
# npm with their own deps already resolved, so this catalog governs only our
# resolutions. This repo may lead the editor repo on shared dev tooling (it
# currently does) — never downgrade an entry here just to match it.
#
# What alignment does buy: `react`, `react-dom`, `reactflow` and `monaco-editor`
# are PEER dependencies of @cyoda/workflow-react / -viewer / -monaco, satisfied
# from this catalog. Keep those four inside the published peer ranges when
# bumping. `monaco-editor` is the tight one — workflow-monaco declares
# `>=0.45 <0.56`, so 0.55.1 sits just under the ceiling and going to 0.56 needs a
# workflow-monaco release first.
catalog:
  "@changesets/cli": 2.31.0
  "@playwright/test": 1.61.1
  "@testing-library/dom": 10.4.1
  "@testing-library/react": 16.3.2
  "@types/node": 26.1.0
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
  "@eslint/js": 10.0.1
  "@typescript-eslint/eslint-plugin": 8.62.1
  "@typescript-eslint/parser": 8.62.1
  "@vitejs/plugin-react": 6.0.3
  "@vitest/coverage-v8": 4.1.9
  eslint: 10.6.0
  fast-check: 4.8.0
  elkjs: 0.11.1
  immer: 11.1.9
  jsdom: 29.1.1
  jsonc-parser: 3.3.1
  monaco-editor: 0.55.1
  prettier: 3.9.4
  typescript-eslint: 8.62.1
  react: 19.2.7
  react-dom: 19.2.7
  reactflow: 11.11.4
  tsup: 8.5.1
  typescript: 6.0.3
  uuid: 14.0.1
  vite: 8.1.2
  vitest: 4.1.9
  zod: 4.4.3
