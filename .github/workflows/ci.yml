name: CI
on: [push, pull_request]
jobs:
  js:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Build first: workspace packages resolve to their gitignored dist/, so
      # lint/typecheck/test must run after the packages are built.
      - run: pnpm -r build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm -r test
      # model-editor-mcp render smoke: headless-Chromium check that its web bundle actually
      # mounts React Flow nodes over a live MCP stdio session. `pnpm -r build` above already
      # produced dist/ + web/dist/, but the filtered build here is cheap and keeps this step's
      # prerequisite explicit rather than implicit in an earlier, unrelated step.
      - run: pnpm --filter @cyoda/model-editor-mcp build
      - run: pnpm --filter @cyoda/model-editor-mcp exec playwright install --with-deps chromium
      - run: pnpm --filter @cyoda/model-editor-mcp test:e2e
  rust:
    runs-on: macos-14
    defaults: { run: { working-directory: apps/dev-console/src-tauri } }
    steps:
      - uses: actions/checkout@v7
      # Reads the pinned channel + components from the repo-root rust-toolchain.toml
      # (no `toolchain:` input, so the file wins) and caches the toolchain + crates.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: "apps/dev-console/src-tauri" }
      - run: cargo fmt --check
      # --locked is the Cargo analogue of the js job's `--frozen-lockfile`: fail
      # if Cargo.lock is out of date instead of silently regenerating it.
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked

  # Packaged-app smoke test: launches the REAL Tauri binary via tauri-driver and
  # asserts the Monaco JSON editor renders under the enforced CSP. Catches
  # production-only breakage (CSP/nonce, workers, protocol) that `tauri dev` and
  # unit tests can't see. Linux-only — tauri-driver has no macOS support.
  e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: "apps/dev-console/src-tauri" }
      - name: Install Tauri + WebDriver system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils \
            webkit2gtk-driver xvfb
      - run: pnpm install --frozen-lockfile
      # Build workspace packages (dist/ is gitignored) so the app frontend resolves them.
      - run: pnpm -r build
      # Build the debug binary (no bundle) for tauri-driver to launch.
      - name: Build Tauri app binary
        run: pnpm --filter dev-console exec tauri build --debug --no-bundle
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Run packaged Monaco e2e (headless)
        run: xvfb-run -a pnpm --filter dev-console test:e2e
